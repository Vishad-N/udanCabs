services:
  - type: web
    name: udan-cabs-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    # start:prod runs `prisma migrate deploy` first (free plan has no preDeployCommand)
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_BUSINESS_PHONE
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_NEW_BOOKING
        sync: false
      - key: WHATSAPP_TEMPLATE_DRIVER_ASSIGNED
        sync: false
      - key: WHATSAPP_TEMPLATE_TRIP_STARTED
        sync: false
      - key: WHATSAPP_TEMPLATE_TOUR_CONFIRMED
        sync: false
      - key: WHATSAPP_TEMPLATE_BOOKING_CANCELLED
        sync: false
